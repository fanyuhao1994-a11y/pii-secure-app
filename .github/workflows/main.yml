name: CI Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: pii_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/pii_db
      # 从 GitHub Repository Secrets 中安全读取
      PII_ENCRYPTION_KEY: ${{ secrets.PII_ENCRYPTION_KEY }}
      PII_BLIND_INDEX_SALT: ${{ secrets.PII_BLIND_INDEX_SALT }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Initialize Database Schema
        run: psql ${{ env.DATABASE_URL }} -f src/scripts/init-db.sql

      - name: Run Tests with Coverage
        run: npm test
