name: CI / Integration Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: pii_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Initialize Database Schema
        run: PGPASSWORD=postgrespassword psql -h localhost -U postgres -d pii_db -f ./scripts/init-db.sql

      - name: Run TypeScript Type Check
        run: npm run type-check

      - name: Run Integration Tests
        env:
          PORT: 3000
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/pii_db"
          PII_ENCRYPTION_KEY: "84b042b9b5ee732adfae170676edf27546a8f71e75c5f6907a168620b4ab416e"
          PII_BLIND_INDEX_SALT: "c9cf5a1e7a0353c10441a3c547736fd5bd0865da0601382bfef5ef6dbe2a8f14"
          JWT_SECRET: "ci_test_jwt_secret_key"
        run: npm test